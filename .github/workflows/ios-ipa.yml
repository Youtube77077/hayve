# Builds an UNSIGNED Hayve .ipa on a macOS runner with Xcode.
# Sideloading tools (AltStore, SideStore, Sideloadly, Feather, ESign…) re-sign it
# with your own Apple ID / certificate when you install it.
name: iOS IPA (unsigned, for sideloading)

on:
  push:
    branches: ['main', 'claude/**']
    paths-ignore: ['**.md', 'docs/**', 'supabase/**', 'server/**', '.do/**']
  workflow_dispatch:

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # Mapbox iOS SDK 11.33 ships binaries built with Swift 6.3, so this needs Xcode 26.4 or newer.
    runs-on: macos-26
    timeout-minutes: 75
    # Public map keys (repository secrets). Without them the app uses its built-in map preview.
    env:
      EXPO_PUBLIC_MAPBOX_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN || vars.MAPBOX_PUBLIC_TOKEN }}
      EXPO_PUBLIC_MAPBOX_STYLE_URL: ${{ secrets.MAPBOX_STYLE_URL || vars.MAPBOX_STYLE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Typecheck and test
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: Select the newest Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -n 1)
          if [ -n "$XC" ]; then sudo xcode-select -s "$XC/Contents/Developer"; fi
          xcodebuild -version
          swift --version

      - name: Generate native iOS project (Expo prebuild)
        run: npx expo prebuild --platform ios --clean --no-install
        env:
          CI: 1

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build Release .app (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Hayve.xcworkspace \
            -scheme Hayve \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee xcodebuild.log | xcbeautify --renderer github-actions

      - name: Show Xcode errors
        if: failure()
        run: |
          echo "---- error lines ----"
          grep -nE "error:|fatal error|BUILD FAILED|The following build commands failed" xcodebuild.log | head -80 || true
          echo "---- last 60 lines ----"
          tail -n 60 xcodebuild.log || true

      - name: Package .ipa
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          echo "Built app: $APP"
          test -f "$APP/main.jsbundle" && echo "JS bundle embedded ✓"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry Hayve.ipa Payload
          ls -lh Hayve.ipa

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Hayve-ipa-${{ github.run_number }}
          path: Hayve.ipa
          retention-days: 30

      - name: Publish pre-release with the .ipa
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-build-${{ github.run_number }}
          name: Hayve iOS build ${{ github.run_number }} (unsigned, for sideloading)
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: Hayve.ipa
          body: |
            Unsigned Hayve build for sideloading (AltStore / SideStore / Sideloadly / Feather).
            Commit: ${{ github.sha }}

            Demo login: sam@hayve.app / hayve123 (more demo accounts on the sign-in screen).
            All payments and services in this build are simulated.

      # One permanent download link for the newest build from main:
      #   https://github.com/<owner>/<repo>/releases/latest/download/Hayve.ipa
      - name: Update the "latest" release (main only)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete ios-latest --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create ios-latest Hayve.ipa \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Hayve for iPhone (latest)" \
            --latest \
            --notes "Newest Hayve build from main (build ${{ github.run_number }}, commit ${GITHUB_SHA::7}).

          Install: download Hayve.ipa on your computer or iPhone and open it with AltStore, SideStore, Sideloadly or Feather; they sign it with your own Apple ID.

          Demo login: sam@hayve.app / hayve123. All payments and services in this build are simulated."
