name: CI

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npx expo lint
      - name: Backend tests (gifting privacy, ledger, services)
        run: npx vitest run
      - name: Database schema & gifting privacy tests (PostgreSQL)
        run: bash supabase/tests/run.sh
      - name: Build website
        run: npx expo export --platform web
      - uses: actions/upload-artifact@v4
        with:
          name: hayve-web
          path: dist
          retention-days: 14
