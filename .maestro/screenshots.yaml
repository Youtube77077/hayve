# Captures the native iOS app: public welcome screen, sign-in, then every tab.
# Run by .github/workflows/ios-screenshots.yml on an iOS Simulator.
appId: com.hayve.app
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- extendedWaitUntil:
    visible: "Sign in"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 01-welcome
- tapOn: "Sign in"
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 02-sign-in
# The demo accounts are below the form on a phone screen.
- scrollUntilVisible:
    element:
      id: "demo-sam"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn:
    id: "demo-sam"
- extendedWaitUntil:
    visible: "Recent activity"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 03-home
- openLink: "hayve:///explore"
- tapOn:
    text: "Open"
    optional: true
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*Browse by category.*"
    timeout: 15000
    optional: true
- takeScreenshot: 04-search
- openLink: "hayve:///shop"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*Sell an item.*"
    timeout: 15000
    optional: true
- takeScreenshot: 05-shop
- openLink: "hayve:///pay"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*Hayve balance.*"
    timeout: 15000
    optional: true
- takeScreenshot: 06-pay
- openLink: "hayve:///pay/request?mode=split"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*Splitting between.*"
    timeout: 15000
    optional: true
- takeScreenshot: 06d-request-split
- openLink: "hayve:///pay/methods"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*Bank account for withdrawals.*"
    timeout: 15000
    optional: true
- takeScreenshot: 06e-payout-account
- openLink: "hayve:///business/driver"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: 06f-hayve-driver
- openLink: "hayve:///bites"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*Restaurants.*"
    timeout: 15000
    optional: true
- takeScreenshot: 08-bites
- openLink: "hayve:///drive"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*cars available.*"
    timeout: 15000
    optional: true
- takeScreenshot: 09-drive
- openLink: "hayve:///stay"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*Check in.*"
    timeout: 15000
    optional: true
- takeScreenshot: 10-stay
- openLink: "hayve:///profile"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*Profile.*"
    timeout: 15000
    optional: true
- takeScreenshot: 11-profile
- openLink: "hayve:///services"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible: ".*Search.*"
    timeout: 15000
    optional: true
- takeScreenshot: 12-more
- openLink: "hayve:///ride"
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible: ".*Where to?.*"
    timeout: 15000
    optional: true
- takeScreenshot: 13-ride
- tapOn:
    text: "Amsterdam Centraal"
    optional: true
- waitForAnimationToEnd:
    timeout: 6000
- extendedWaitUntil:
    visible: ".*Request.*"
    timeout: 15000
    optional: true
- takeScreenshot: 14-ride-route
